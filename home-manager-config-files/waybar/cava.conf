# cava config for the waybar visualizer module (raw ascii to stdout)
[general]
bars = 10
framerate = 30
autosens = 1
# must stay above GRACE in cava.sh, or bars freeze instead of hiding
sleep_timer = 10

[input]
method = pipewire

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 7

[smoothing]
noise_reduction = 45
