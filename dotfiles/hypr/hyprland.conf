# ╔══════════════════════════════════════════════════════════════════════╗
# ║  Hyprland — Kanagawa Ink & Wave (docs/THEME.md)                        ║
# ║  Sourced by home-manager (modules/home-manager/desktop/hyprland.nix)   ║
# ║  Companion theming: waybar, hyprlock, fuzzel, swaync, wlogout          ║
# ╚══════════════════════════════════════════════════════════════════════╝

# ── palette (Kanagawa Wave, inlined) ─────────────────────────────────────
#   crystalBlue 7E9CD8 · oniViolet 957FB8 · springBlue 7FB4CA
#   carpYellow E6C384 · waveRed E46876 · peachRed FF5D62
#   sumiInk0 16161D · sumiInk3 1F1F28 · sumiInk6 54546D


# ═══ MONITORS ════════════════════════════════════════════════════════════

monitor = HDMI-A-1, 1920x1080@75, 0x0, 1
monitor = eDP-1, disable
monitor = , preferred, auto, 1        # sane fallback for anything hotplugged


# ═══ PROGRAMS ════════════════════════════════════════════════════════════

$terminal   = kitty
$fileManager = dolphin
$menu       = fuzzel
$screenshot = flameshot gui


# ═══ AUTOSTART ═══════════════════════════════════════════════════════════
# systemd user services (home-manager): awww-daemon (wallpaper), swaync,
# hyprpaper is retired. Only non-service tools start here.

exec-once = wl-paste --watch cliphist store
exec-once = waybar


# ═══ ENVIRONMENT ═════════════════════════════════════════════════════════

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24


# ═══ LOOK AND FEEL ═══════════════════════════════════════════════════════

general {
    gaps_in = 6
    gaps_out = 6, 14, 14, 14    # top tightened — waybar brings its own margin
    border_size = 3

    # ink & wave sweep: crystalBlue → oniViolet → springBlue, animated by
    # borderangle below; inactive stays borderless so focus is unmistakable
    col.active_border = rgba(7e9cd8ee) rgba(957fb8ee) rgba(7fb4caee) 45deg
    col.inactive_border = rgba(00000000)

    resize_on_border = true
    allow_tearing = false

    layout = dwindle
}

decoration {
    rounding = 10
    rounding_power = 3          # squircle corners

    active_opacity = 1.0
    inactive_opacity = 1.0
    dim_inactive = true
    dim_strength = 0.12         # unfocused windows visibly recede
    dim_special = 0.25          # dim behind the scratchpad overlay

    # subtle vibrance — muted colors get a gentle lift (docs in the shader).
    # Disabled: a full-screen per-pixel pass every frame costs real FPS on
    # the Vega 7 iGPU. Uncomment to trade smoothness for the look.
    # screen_shader = ~/nixos/dotfiles/hypr/shaders/vibrance.frag

    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(16161daa)
    }

    blur {
        enabled = true
        size = 6
        passes = 2      # 3 passes at size 8 dropped frames on the Vega 7 iGPU
        popups = true
        special = false     # blurring special workspace backdrop is expensive — caused fullscreen jitter in scratchpad; dim_special still marks the overlay
        vibrancy = 0.25
        vibrancy_darkness = 0.3
    }
}

animations {
    enabled = yes

    # material-expressive curves + end-4 style menu curves
    bezier = standard, 0.2, 0, 0, 1
    bezier = emphasizedDecel, 0.05, 0.7, 0.1, 1
    bezier = emphasizedAccel, 0.3, 0, 0.8, 0.15
    bezier = overshot, 0.18, 0.9, 0.28, 1.08
    bezier = menuDecel, 0.1, 1, 0, 1
    bezier = menuAccel, 0.38, 0.04, 1, 0.07

    animation = global, 1, 8, standard
    # the gradient sweep the col.active_border above promises: on focus the
    # angle rotates once through crystalBlue → oniViolet → springBlue, then
    # stops. `loop` would repaint the border every frame forever — on the
    # Vega 7 that is a permanent tax for an effect nobody looks at.
    animation = borderangle, 1, 30, standard, once
    animation = windows, 1, 5, overshot, popin 85%
    animation = windowsIn, 1, 5, overshot, popin 85%
    animation = windowsOut, 1, 3, emphasizedAccel, popin 90%
    animation = windowsMove, 1, 5, overshot
    animation = border, 1, 8, standard
    animation = fade, 1, 3, standard
    animation = layers, 1, 4, menuDecel, popin 90%
    animation = layersOut, 1, 2.5, menuAccel, fade
    animation = workspaces, 1, 4, emphasizedDecel, slide
    animation = specialWorkspace, 1, 4, emphasizedDecel, slidefadevert 15%
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

# tabbed window groups (SUPER+T to group, SUPER+Tab to cycle) — the groupbar
# is the same ink-and-pigment language as the waybar workspace pills: active
# tab in the crystalBlue→oniViolet sweep, inactive tabs sunk into sumiInk4
group {
    col.border_active = rgba(7e9cd8ee) rgba(957fb8ee) 45deg
    col.border_inactive = rgba(2a2a37aa)
    col.border_locked_active = rgba(e6c384ee) rgba(ffa066ee) 45deg
    col.border_locked_inactive = rgba(2a2a37aa)

    groupbar {
        enabled = true
        font_family = Maple Mono NF
        font_size = 11
        height = 16
        indicator_height = 3
        gradients = true
        rounding = 6
        gradient_rounding = 6
        keep_upper_gap = true
        text_color = rgb(DCD7BA)
        col.active = rgba(7e9cd8dd)
        col.inactive = rgba(2a2a37cc)
        col.locked_active = rgba(e6c384dd)
        col.locked_inactive = rgba(2a2a37cc)
    }
}

misc {
    font_family = Maple Mono NF
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    background_color = rgb(16161D)
}

cursor {
    inactive_timeout = 8
}

ecosystem {
    no_update_news = true
}

xwayland {
    force_zero_scaling = true
}


# ═══ INPUT ═══════════════════════════════════════════════════════════════

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = false
    }
}

# three-finger swipe between workspaces
gesture = 3, horizontal, workspace


# ═══ KEYBINDINGS ═════════════════════════════════════════════════════════

$mainMod = SUPER

# ── apps ──
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, N, exec, $screenshot
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, R, exec, $menu

# ── shell: notifications · wallpaper · power ──
bind = $mainMod, B, exec, swaync-client -t -sw               # notification center
bind = $mainMod SHIFT, N, exec, swaync-client --close-all
bind = $mainMod, W, exec, wallpaper next                     # animated wall cycle
bind = $mainMod SHIFT, W, exec, wallpaper random
bind = $mainMod, Escape, exec, wlogout -b 3 --protocol layer-shell

# 七十二候 — what five-day microseason is it? (lib/sekki.nix)
bind = $mainMod, K, exec, sekki notify

# 禅 — zen mode: bar folds away, gaps open into paper margins
bind = $mainMod, Z, exec, ~/nixos/dotfiles/hypr/scripts/zen.sh

# ── window management ──
bind = $mainMod, C, killactive,
bind = $mainMod SHIFT, C, exec, hyprpicker -a   # pick a color, hex lands in clipboard
bind = $mainMod, V, togglefloating,
bind = $mainMod, P, pseudo,             # dwindle
bind = $mainMod, J, layoutmsg, togglesplit
bind = $mainMod, F, fullscreen, 1
bind = $mainMod SHIFT, F, fullscreen, 0

# alt+tab window cycling
bind = ALT, Tab, cyclenext,
bind = ALT SHIFT, Tab, cyclenext, prev

# ── tabbed groups ──
bind = $mainMod, T, togglegroup,
bind = $mainMod, Tab, changegroupactive, f
bind = $mainMod SHIFT, Tab, changegroupactive, b
bind = $mainMod SHIFT, T, lockactivegroup, toggle

# workspace overview (Hyprspace plugin; errors harmlessly until rebuild)
bind = $mainMod, grave, overview:toggle

# ── focus ──
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# ── move window ──
bind = SUPER SHIFT, left, movewindow, l
bind = SUPER SHIFT, right, movewindow, r
bind = SUPER SHIFT, up, movewindow, u
bind = SUPER SHIFT, down, movewindow, d

# ── workspaces ──
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# scratchpad
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# scroll through workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# drag to move / resize
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ── media & hardware keys ──
# swayosd-client shows an OSD; falls back to raw wpctl/brightnessctl until
# the rebuild that installs swayosd
bindel = ,XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise || wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, swayosd-client --output-volume lower || wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, swayosd-client --output-volume mute-toggle || wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, swayosd-client --input-volume mute-toggle || wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, swayosd-client --brightness raise || brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, swayosd-client --brightness lower || brightnessctl s 10%-

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous


# ── resize submap ────────────────────────────────────────────────────────
# SUPER+X enters it; waybar's hyprland/submap module paints a gold pill in the
# left island so the mode is never invisible. Escape/Return leave.
# MUST stay last in this section — every bind between `submap = resize` and
# `submap = reset` belongs to the submap, not to the global map.

bind = $mainMod, X, submap, resize

submap = resize

binde = , left,  resizeactive, -40 0
binde = , right, resizeactive, 40 0
binde = , up,    resizeactive, 0 -40
binde = , down,  resizeactive, 0 40
binde = , h, resizeactive, -40 0
binde = , l, resizeactive, 40 0
binde = , k, resizeactive, 0 -40
binde = , j, resizeactive, 0 40

bind = , escape, submap, reset
bind = , Return, submap, reset

submap = reset


# ═══ WORKSPACE RULES ═════════════════════════════════════════════════════

# scratchpad inherits regular gaps — dim_special marks it as an overlay


# ═══ WINDOW RULES ════════════════════════════════════════════════════════

# ignore maximize requests from apps
windowrule {
    name = suppress-maximize-events
    match:class = .*
    suppress_event = maximize
}

# fix some dragging issues with XWayland
windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

# warn red border while maximized (fullscreen mode 1); normal borders
# restore automatically on exit — a match:fullscreen 0 rule would paint
# EVERY non-fullscreen window with the active gradient, killing focus contrast
windowrule = match:fullscreen 1, border_color rgba(ff5d62ee) rgba(e46876ee) 45deg

# floating windows wear the violet half of the sweep, so "is this tiled?" is
# answerable from the border alone. Safe where a fullscreen 0 match isn't:
# match:float 1 selects only floats, not every ordinary window.
windowrule = match:float 1, border_color rgba(957fb8ee) rgba(7fb4caee) 45deg

# flameshot v14 on Hyprland — without these, the overlay positions/sizes wrong
windowrule {
    name = flameshot
    match:class = flameshot
    float = 1
    pin = 1
    no_anim = 1
    move = 0 0
}

# system TUIs launched from waybar (btop, nmtui, bluetoothctl, docker stats)
windowrule {
    name = waybar-tui-popup
    match:class = waybar-tui
    float = 1
    size = 1100 680
    center = 1
}

# audio mixer as a floating panel
windowrule {
    name = float-audio-mixer
    match:class = (org.pulseaudio.pavucontrol|pavucontrol)
    float = 1
    size = 900 620
    center = 1
}

# picture-in-picture: pinned, bottom-right, always on top
windowrule {
    name = pip
    match:title = ^(Picture-in-Picture)$
    float = 1
    pin = 1
    keep_aspect_ratio = 1
    size = 480 270
    move = 100%-500 100%-310
}

# file pickers and dialogs float centered
windowrule {
    name = float-dialogs
    match:title = ^(Open File|Save File|Open Folder|Select Folder|File Upload)(.*)$
    float = 1
    size = 60% 65%
    center = 1
}

# keep the screen awake while anything runs fullscreen (video calls, players)
windowrule {
    name = fullscreen-idle-inhibit
    match:class = .*
    idle_inhibit = fullscreen
}

# terminal depth: unfocused terminals go faintly translucent (compositor
# blur fills in behind) — pairs with dim_inactive for a layered ink look
windowrule {
    name = terminal-depth
    match:class = (kitty|com.mitchellh.ghostty|org.wezfurlong.wezterm)
    opacity = 1.0 0.94
}


# ═══ PLUGINS ═════════════════════════════════════════════════════════════
# Loaded by home-manager (hyprspace, hypr-dynamic-cursors); this block
# errors harmlessly on reload until the first rebuild.

plugin {
    overview {
        panelColor = rgba(1f1f28cc)
        panelBorderColor = rgba(54546d88)
        workspaceActiveBorder = rgba(7e9cd8ee)
        workspaceInactiveBorder = rgba(36364655)
        panelBorderWidth = 2
        gapsIn = 6
        gapsOut = 12
        exitOnClick = true
        switchOnDrop = true
        centerAligned = true
        showNewWorkspace = true
    }

    dynamic-cursors {
        enabled = true
        mode = tilt        # cursor leans into acceleration
        threshold = 2

        shake {
            enabled = true # shake cursor to magnify it
            magnify = true
        }
    }
}


# ═══ LAYER RULES ═════════════════════════════════════════════════════════
# frosted glass for the shell: waybar islands, fuzzel, swaync, swayosd, wlogout
#
# `xray 1` makes a layer's blur sample the wallpaper only, skipping every
# window underneath. It is both cheaper (one static texture instead of the
# live window stack, re-blurred per frame as those windows repaint) and
# calmer to look at — the bar stops strobing when a terminal scrolls behind
# it. The shell reads as glass over paper, not glass over chaos.

layerrule = match:namespace waybar, blur 1
layerrule = match:namespace waybar, ignore_alpha 0.29
layerrule = match:namespace waybar, xray 1
layerrule = match:namespace launcher, blur 1
layerrule = match:namespace launcher, ignore_alpha 0.29
layerrule = match:namespace launcher, xray 1
layerrule = match:namespace swaync-notification-window, blur 1
layerrule = match:namespace swaync-notification-window, ignore_alpha 0.29
layerrule = match:namespace swaync-control-center, blur 1
layerrule = match:namespace swaync-control-center, ignore_alpha 0.29
layerrule = match:namespace swayosd, blur 1
layerrule = match:namespace swayosd, ignore_alpha 0.29
layerrule = match:namespace swayosd, xray 1
layerrule = match:namespace logout_dialog, blur 1
